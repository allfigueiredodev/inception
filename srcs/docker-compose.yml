version: '3.9'

services:
  mariadb:
    build:
      context: .
      dockerfile: requirements/mariadb/Dockerfile
      args:
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASS: ${DB_PASS}
        DB_ROOT: ${DB_ROOT}
    container_name: mariadb
    networks:
      - inception
    volumes:
      - db-volume:/var/lib/mysql
    restart: always
    env_file:
      - .env

  wordpress:
    build:
      context: .
      dockerfile: requirements/wordpress/Dockerfile
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASS: ${DB_PASS}
        WP_COMMOM_USER: ${WP_COMMOM_USER}
        WP_COMMOM_USER_EMAIL: ${WP_COMMOM_USER_EMAIL}
        WP_COMMOM_USER_PASS: ${WP_COMMOM_USER_PASS}
        WP_ADM: ${WP_ADM}
        WP_ADM_EMAIL: ${WP_ADM_EMAIL}
        WP_ADM_PASS: ${WP_ADM_PASS}
    container_name: wordpress
    networks:
      - inception
    depends_on:
      - mariadb
    restart: always
    volumes:
      - wp-volume:/var/www/html
    env_file:
      - .env

  nginx:
    build:
      context: .
      dockerfile: requirements/nginx/Dockerfile
    container_name: nginx
    depends_on:
      - wordpress
      - mariadb
    networks:
      - inception
    ports:
      - "443:443"
    volumes:
      - ./requirements/nginx/conf/:/etc/nginx/http.d/
      - wp-volume:/var/www/html
    restart: always
    env_file:
      - .env

volumes:
  wp-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/${LOGIN}/data/wordpress

  db-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/${LOGIN}/data/mariadb

networks:
    inception:
        driver: bridge  
    