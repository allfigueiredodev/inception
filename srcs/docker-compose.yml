version: '3'

services:
  mariadb:
    build:
      context: .
      dockerfile: requirements/mariadb/Dockerfile
      args:
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASS: ${DB_PASS}
        DB_ROOT: ${DB_ROOT}
    container_name: mariadb
    # healthcheck:
    #   test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 60s
    networks:
      - inception
    ports:
      - "3306:3306"
    volumes:
      - db-volume:/var/lib/mysql
    restart: always
    env_file:
      - .env

  wordpress:
    build:
      context: .
      dockerfile: requirements/wordpress/Dockerfile
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASS: ${DB_PASS}
        WP_COMMOM_USER: ${WP_COMMOM_USER}
        WP_COMMOM_USER_EMAIL: ${WP_COMMOM_USER_EMAIL}
        WP_COMMOM_USER_PASS: ${WP_COMMOM_USER_PASS}
        WP_ADM: ${WP_ADM}
        WP_ADM_EMAIL: ${WP_ADM_EMAIL}
        WP_ADM_PASS: ${WP_ADM_PASS}
    # healthcheck:
    #   test: ["CMD", "curl -f http://localhost:3306 || exit 1"]
    #   interval: 5s
    #   timeout: 10s
    #   retries: 5
    # healthcheck:
    #   test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 90s
    container_name: wordpress
    ports:
      - "9000:9000"
    networks:
      - inception
    depends_on:
      - mariadb
      # mariadb:
      #   condition: service_healthy
    restart: always
    volumes:
      - wp-volume:/var/www/wordpress
    env_file:
      - .env

  nginx:
    build:
      context: .
      dockerfile: requirements/nginx/Dockerfile
    container_name: nginx
    depends_on:
      - wordpress
      - mariadb
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f https://localhost || exit 1"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    networks:
      - inception
    ports:
      - "443:443"
    volumes:
      - ./requirements/nginx/conf/:/etc/nginx/http.d/
      - ./requirements/nginx/tools:/etc/nginx/ssl/
      - wp-volume:/var/www/wordpress
    restart: always
    env_file:
      - .env

volumes:
  wp-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/wordpress

  db-volume:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/${USER}/data/mariadb

networks:
    inception:
        driver: bridge  
    